<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>日語縱貫線</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-width column styled as a Japanese railway journey —
   station name boards (駅名標) for weeks, an LED departure board (発車標) for today's plan,
   and ink station stamps (駅スタンプ) as badges. Line colors identify the course stage. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#17212B; --muted:#5B6873; --line:#D5DDE0;
  --kana:#0089BE; --n5:#2F9447; --n4:#DD6A10; --exam:#6B4FB0;
  --ok:#23824F; --ok-bg:#E3F3E9; --bad:#C2303B; --bad-bg:#FBE6E7;
  --led-bg:#101713; --led:#F3B23A; --led-dim:#5E4A1F; --led-green:#6FE08A;
  --stamp:#B3263A; --shadow:0 1px 2px rgba(23,33,43,.06),0 4px 14px rgba(23,33,43,.06);
  --f-jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --f-led:"DotGothic16","Zen Kaku Gothic New",monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1215; --surface:#161E23; --surface-2:#1C262C; --ink:#E6ECEE; --muted:#93A2AC; --line:#2A363D;
  --kana:#35B4E6; --n5:#4CC069; --n4:#F58A35; --exam:#9A80E0;
  --ok:#4CC979; --ok-bg:#163525; --bad:#F06A73; --bad-bg:#3A1A1E;
  --led-bg:#070B09; --stamp:#E8596C; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1215; --surface:#161E23; --surface-2:#1C262C; --ink:#E6ECEE; --muted:#93A2AC; --line:#2A363D;
  --kana:#35B4E6; --n5:#4CC069; --n4:#F58A35; --exam:#9A80E0;
  --ok:#4CC979; --ok-bg:#163525; --bad:#F06A73; --bad-bg:#3A1A1E;
  --led-bg:#070B09; --stamp:#E8596C; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.jp{font-family:var(--f-jp)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--kana);outline-offset:2px}
#app{max-width:600px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.topbar .brand{font-family:var(--f-jp);font-weight:900;font-size:18px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand .mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(180deg,var(--n5) 0 33%,var(--n4) 33% 66%,var(--exam) 66%)}
.topbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok .dot{background:var(--ok)}
.chip.warn .dot{background:var(--n4)}
.iconbtn{background:none;border:0;padding:6px;border-radius:10px;display:inline-flex}
.iconbtn:hover{background:var(--surface)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 4px;color:var(--muted);font-size:14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.section-title{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;text-transform:uppercase;margin:6px 2px 0}

/* 駅名標 station board */
.ekimei{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.ekimei .body{padding:16px 16px 10px;text-align:center;position:relative}
.ekimei .code{position:absolute;left:14px;top:14px;border:3px solid var(--lc);border-radius:7px;width:48px;text-align:center;line-height:1.05;padding:3px 0;background:var(--surface)}
.ekimei .code small{display:block;font-size:11px;font-weight:700;color:var(--lc);letter-spacing:.05em}
.ekimei .code b{display:block;font-size:19px;font-family:var(--f-jp);font-weight:900}
.ekimei .kanji{font-family:var(--f-jp);font-weight:900;font-size:clamp(34px,10vw,46px);letter-spacing:.12em;line-height:1.15}
.ekimei .kana{font-family:var(--f-jp);font-weight:500;font-size:15px;letter-spacing:.25em;color:var(--muted)}
.ekimei .ro{font-size:13px;letter-spacing:.08em;color:var(--muted)}
.ekimei .stripe{background:var(--lc);color:#fff;display:flex;justify-content:space-between;padding:5px 12px;font-family:var(--f-jp);font-weight:700;font-size:13px}
.ekimei .stripe span{opacity:.95;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ekimei .sub{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:13.5px;align-items:center}

/* LED board */
.led{background:var(--led-bg);border-radius:10px;padding:12px 12px 8px;color:var(--led);font-family:var(--f-led);box-shadow:inset 0 0 0 2px #222c27, var(--shadow)}
.led .head{display:flex;justify-content:space-between;font-size:12px;color:var(--led-dim);letter-spacing:.1em;padding:0 4px 6px;border-bottom:1px dashed #2a3530}
.led .head b{color:var(--led-green);font-weight:400}
.led-row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed #2a3530;padding:10px 4px;color:var(--led);font-family:var(--f-led);font-size:15px}
.led-row:last-child{border-bottom:0}
.led-row .kind{font-size:12px;border:1px solid currentColor;border-radius:3px;text-align:center;padding:1px 0}
.led-row .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led-row .what small{display:block;font-size:11.5px;color:#a98a4d}
.led-row .go{font-size:13px;color:var(--led-green)}
.led-row.done{color:var(--led-dim)}
.led-row.done .go{color:var(--led-dim)}
.led-row:hover:not(.done){background:#17211c}
.led .k-review{color:#7fd3ff}.led .k-lesson{color:var(--led)}.led .k-talk{color:#ff9e9e}.led .k-test{color:#c9b3ff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-family:var(--f-jp);font-weight:900;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--lc,var(--n5));border-radius:99px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:700;font-size:15px;min-height:46px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.line{background:var(--lc);border-color:var(--lc);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}

/* route map */
.route{position:relative;padding-left:0}
.stn{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 0;position:relative;min-height:62px}
.stn .rail{position:relative;height:100%;align-self:stretch;display:flex;justify-content:center}
.stn .rail::before{content:"";position:absolute;top:0;bottom:0;width:8px;background:var(--lc);left:50%;transform:translateX(-50%)}
.stn:first-child .rail::before{top:50%}
.stn:last-child .rail::before{bottom:50%}
.stn .dot{position:relative;z-index:1;align-self:center;width:24px;height:24px;border-radius:50%;background:var(--surface);border:4px solid var(--lc);display:grid;place-items:center}
.stn.locked .dot{border-color:var(--line)}
.stn.locked .rail::before{background:var(--line)}
.stn.current .dot{width:32px;height:32px;background:var(--lc);box-shadow:0 0 0 5px color-mix(in srgb,var(--lc) 25%,transparent)}
.stn.passed .dot{background:var(--lc)}
.stn .info{min-width:0}
.stn .info .nm{font-family:var(--f-jp);font-weight:900;font-size:17px;letter-spacing:.05em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stn .info .nm small{font-family:var(--f-zh);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.stn .info .tt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn.locked .info{opacity:.55}
.stn .meta{font-size:12px;color:var(--muted);text-align:right}
.xfer{margin:4px 0 4px 64px;font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.xfer i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--lc)}
.ministamp{width:34px;height:34px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;font-size:11px;transform:rotate(-12deg);line-height:1}

/* lesson list */
.lesson{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.lesson .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;font-size:17px;background:var(--surface-2);color:var(--lc);border:1px solid var(--line)}
.lesson.done .ic{background:var(--lc);color:#fff;border-color:var(--lc)}
.lesson .t{font-weight:700}
.lesson .d{font-size:12.5px;color:var(--muted)}
.lesson .st{font-size:12px;color:var(--muted);white-space:nowrap}
.lesson.done .st{color:var(--ok);font-weight:700}

/* quiz */
.qwrap{display:flex;flex-direction:column;gap:14px}
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:var(--shadow)}
.prompt .ask{font-size:13px;color:var(--muted)}
.prompt .big{font-family:var(--f-jp);font-weight:700;font-size:clamp(30px,9vw,44px);line-height:1.25;word-break:break-word}
.prompt .big.kana-only{font-size:clamp(56px,18vw,84px)}
.prompt .big.sent{font-size:clamp(19px,5vw,23px);font-weight:500;line-height:1.7;text-align:left}
.prompt .rd{font-family:var(--f-jp);font-size:16px;color:var(--muted)}
.prompt .ro{font-size:13px;color:var(--muted);letter-spacing:.04em}
.prompt .zhbig{font-size:24px;font-weight:700}
.speak{display:inline-flex;align-items:center;gap:6px;align-self:center;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:13px}
.speak.huge{padding:14px 22px;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 12px;min-height:58px;text-align:left;display:flex;gap:10px;align-items:center;font-size:16px;line-height:1.45;min-width:0}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--muted)}
.opt .tx{min-width:0;word-break:break-word}
.opt .tx small{display:block;font-size:12px;color:var(--muted)}
.opt.jp .tx{font-family:var(--f-jp)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.picked{border-color:var(--ink);background:var(--surface-2)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .jp{color:var(--ink)}
.feedback .ex{color:var(--ink);margin-top:4px}

/* learn card */
.learn{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.learn .head{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.learn .glyph{font-family:var(--f-jp);font-weight:700;font-size:clamp(40px,12vw,60px);line-height:1.2}
.learn .glyph.kana{font-size:96px;line-height:1}
.learn .glyph.kanji{font-size:96px;font-weight:500;line-height:1.1}
.learn .rd{font-family:var(--f-jp);font-size:18px;color:var(--muted)}
.learn .meaning{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;border-top:1px solid var(--line);padding-top:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-jp);min-width:0}
.example{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.example .s{font-family:var(--f-jp);font-size:16.5px;line-height:1.7}
.example .z{font-size:13.5px;color:var(--muted)}
.note{background:var(--surface-2);border-left:4px solid var(--lc);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.7}
.reveal{background:none;border:1px dashed var(--line);border-radius:8px;padding:2px 10px;font-size:12.5px;color:var(--muted)}

/* convo */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;border-radius:16px;padding:10px 14px;line-height:1.6;position:relative}
.bub .who{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.bub .jp{font-size:17px}
.bub .zh{font-size:13px;color:var(--muted);margin-top:3px}
.bub .ro{font-size:12px;color:var(--muted)}
.bub.npc{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--lc);color:#fff;border-bottom-right-radius:4px}
.bub.me .zh,.bub.me .who,.bub.me .ro{color:rgba(255,255,255,.82)}
.bub .say{position:absolute;right:6px;top:6px}
.bub.npc{padding-right:40px}
.scene-head{display:flex;gap:12px;align-items:center}
.scene-head .badge{flex:none;width:46px;height:46px;border-radius:12px;background:var(--lc);color:#fff;display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;font-size:13px;line-height:1.1;text-align:center}

/* stamps */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--f-jp);padding:6px;position:relative}
.stamp .n{font-weight:900;font-size:17px;letter-spacing:.06em;line-height:1.15}
.stamp .w{font-size:10.5px;font-weight:700}
.stamp .dt{font-size:10px;opacity:.85}
.stamp::before{content:"";position:absolute;inset:4px;border:1px solid currentColor;border-radius:50%;opacity:.6}
.stamp.empty{border-color:var(--line);color:var(--muted);opacity:.6;border-style:dashed}
.stamp.empty::before{display:none}
.stamp.big{width:150px;margin:0 auto}
.stamp.big .n{font-size:26px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--n5) 35%,var(--surface))}
.heat i.l2{background:color-mix(in srgb,var(--n5) 65%,var(--surface))}
.heat i.l3{background:var(--n5);border-color:var(--n5)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}

/* misc */
.list{display:flex;flex-direction:column;gap:8px}
.dict-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.dict-item .a{font-family:var(--f-jp);font-size:17px;font-weight:700}
.dict-item .b{font-size:13px;color:var(--muted)}
.lvl{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lvl.m{border-color:var(--ok);color:var(--ok)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
input[type=search],input[type=date]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.setting{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.result-big{font-family:var(--f-jp);font-weight:900;font-size:54px;line-height:1}
.scoreline{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14.5px}

function chunk(arr, size){ if(!arr.length) return []; const n=Math.ceil(arr.length/size), s=Math.ceil(arr.length/n), out=[]; for(let i=0;i<arr.length;i+=s) out.push(arr.slice(i,i+s)); return out; }
const LESSON_CACHE = {};
function weekLessons(w){
  if (LESSON_CACHE[w]) return LESSON_CACHE[w];
  const W=D.weeks[w], L=[];
  if (w<=3){
    KANA_GROUPS[w].forEach(([title,list,note],i) => L.push({id:`${w}-a${i+1}`, w, type:'learn', kind:'kana', title, items:list.map(([k])=>D.items[(w===3?'K:':'H:')+k]), note}));
    chunk(W.vocab, 16).forEach((items,i) => L.push({id:`${w}-v${i+1}`, w, type:'learn', kind:'vocab', title: w===1?'招呼語':w===2?'數字與救命句':'外來語與實用句', items}));
  } else if (w<=24){
    const K=chunk(W.kanji,14).map((items,i)=>({id:`${w}-k${i+1}`, w, type:'learn', kind:'kanji', title:'漢字 '+items.map(x=>x.jp).join(''), items}));
    const V=chunk(W.vocab,20).map((items,i,a)=>({id:`${w}-v${i+1}`, w, type:'learn', kind:'vocab', title:`單字 ${i+1}/${a.length}`, items}));
    const G=chunk(W.grammar,6).map((items,i,a)=>({id:`${w}-g${i+1}`, w, type:'learn', kind:'grammar', title:`文法 ${i+1}/${a.length}`, items}));
    const order=[...K];
    for (let i=0;i<Math.max(V.length,G.length);i++){ if(V[i]) order.push(V[i]); if(G[i]) order.push(G[i]); }
    L.push(...order);
    READING.filter(r=>r.w===w).forEach((r,i)=>L.push({id:`${w}-r${i+1}`, w, type:'reading', title:'閱讀：'+r.title, passages:[r]}));
  }
  CONVO.filter(c=>c.w===w).forEach(c=>L.push({id:`${w}-c`, w, type:'convo', title:'會話：'+c.title, convo:c}));
  if (w<=24) L.push({id:`${w}-t`, w, type:'test', title:'週測驗（過站考）'});
  if (w===25) L.push(
    {id:'25-weak', w, type:'weak', title:'弱點複習：最常錯的 30 題'},
    {id:'25-m5', w, type:'mock', level:'N5', title:'N5 模擬考'},

    {id:'25-m4a', w, type:'mock', level:'N4', title:'N4 模擬考 第 1 回'});
  if (w===26) L.push(
    {id:'26-m4b', w, type:'mock', level:'N4', title:'N4 模擬考 第 2 回'},

    {id:'26-final', w, type:'final', title:'最後衝刺：全範圍 40 題'});
  return LESSON_CACHE[w]=L;
}

const LS_KEY='jp-jukan-v1';
const freshState = () => ({v:1, start:today(), xp:0, streak:0, best:0, lastDay:null, days:{}, lessons:{}, weeks:{}, srs:{}, convo:{}, exams:[], settings:{romaji:'auto', rate:0.9, zh:true, autoplay:true, unlockAll:false, reviewMax:60, goal:150}, updated:0});
function migrate(s){ const f=freshState(); if(!s||typeof s!=='object') return f; const o={...f,...s}; o.settings={...f.settings,...(s.settings||{})}; return o; }
let state = migrate((()=>{ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } })());
const cloud = {ref:null, status:'local', writing:null, pending:false, timer:null};
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function save(){ state.updated=Date.now(); saveLocal(); if(cloud.ref){ clearTimeout(cloud.timer); cloud.timer=setTimeout(pushCloud, 2500); } }
function pushCloud(){
  if (!cloud.ref) return;
  if (cloud.writing){ cloud.pending=true; return; }
  clearTimeout(cloud.timer);
  cloud.status='syncing'; renderChip();
  const payload={s:JSON.stringify(state), updated:state.updated};
  cloud.writing = cloud.ref.set(payload).then(()=>{ cloud.status='ok'; }).catch(e=>{
    if (e && e.code==='unavailable'){ cloud.status='err'; setTimeout(()=>{ if(!cloud.writing) pushCloud(); }, 3000+Math.random()*2000); }
    else if (e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){ cloud.status='local'; cloud.ref=null; }
    else cloud.status='err';
  }).finally(()=>{ cloud.writing=null; renderChip(); if(cloud.pending){ cloud.pending=false; pushCloud(); } });
}
async function pullCloud(){
  if (!cloud.ref || S || C) return;
  try{
    const snap=await cloud.ref.get();
    if (snap.exists){ const r=snap.data(); if(r && r.updated>state.updated){ state=migrate(JSON.parse(r.s)); saveLocal(); render(); toast('已載入其他裝置的最新進度'); } }
  }catch(e){}
}
async function initCloud(){
  if (!window.claude || !window.claude.use){ cloud.status='local'; renderChip(); return; }
  try{
    const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user){ cloud.status='local'; renderChip(); return; }
    const uid=await user.id();
    if (!uid){ cloud.status='local'; renderChip(); return; }
    cloud.ref=db.doc('data/users/'+uid+'/progress');
    cloud.status='syncing'; renderChip();
    const snap=await cloud.ref.get();
    const r=snap.exists?snap.data():null;
    if (r && r.updated>state.updated){ state=migrate(JSON.parse(r.s)); saveLocal(); cloud.status='ok'; if(!S && !C) render(); toast('已從雲端載入你的學習進度'); }
    else if (state.updated>0 && (!r || state.updated>r.updated)) pushCloud();
    else cloud.status='ok';
    renderChip();
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pullCloud(); else if(cloud.ref && state.updated) pushCloud(); });
  }catch(e){ cloud.status='local'; cloud.ref=null; renderChip(); }
}

const byType = t => Object.values(D.items).filter(x=>x.type===t);
const POOL = {kana:byType('kana'), vocab:byType('vocab'), kanji:byType('kanji'), grammar:byType('grammar')};
function distract(item, key, n=3, filter){
  const ans=key(item), seen=new Set([ans]), out=[];
  const near = POOL[item.type].filter(x=>Math.abs(x.w-item.w)<=4);
  for (const pool of [shuffle(near), shuffle(POOL[item.type])]){
    for (const x of pool){ if(out.length>=n) break; const k=key(x); if(x===item||seen.has(k)||(filter&&!filter(x))) continue; seen.add(k); out.push(k); }
  }
  return out;
}
function mkOpts(answer, others, jp){ const opts=shuffle([answer,...others]); return {opts:opts.map(t=>({t, jp})), ans:opts.indexOf(answer)}; }
function roHtml(kana){ return showRomaji() ? `<div class="ro">${esc(toRomaji(kana))}</div>` : `<button class="reveal" data-reveal="${esc(toRomaji(kana))}">顯示拼音</button>`; }
function makeQ(item, mode){
  const q = {item, mode};
  if (item.type==='kana'){
    mode = mode || pick(listenOK()?['k2ro','k2ro','ro2k','audio']:['k2ro','k2ro','ro2k'],1)[0];
    const ro=x=>x.ro, sameScript=x=>(x.id[0]===item.id[0]);
    if (mode==='ro2k'){ Object.assign(q, {ask:'哪一個假名唸作：', big:`<div class="big">${esc(item.ro)}</div>`, ...mkOpts(item.jp, distract(item,x=>x.jp,3,x=>sameScript(x)&&x.ro!==item.ro), true), speak:item.jp}); }
    else if (mode==='audio'){ Object.assign(q, {ask:'聽發音，選出正確的假名', big:speakBtn(item.jp,'huge'), autoplay:item.jp, ...mkOpts(item.jp, distract(item,x=>x.jp,3,x=>sameScript(x)&&x.ro!==item.ro), true)}); }
    else { Object.assign(q, {ask:'這個假名怎麼唸？', big:`<div class="big kana-only">${esc(item.jp)}</div>`, ...mkOpts(item.ro, distract(item,ro), false), speak:item.jp}); }
    q.explain = `<span class="jp">${esc(item.jp)}</span> ＝ ${esc(item.ro)}`;
  }
  else if (item.type==='vocab'){
    const kanjiWord = hasKanji(item.jp);
    const modes=['jp2zh','jp2zh','zh2jp']; if(kanjiWord) modes.push('reading','reading'); if(listenOK()) modes.push('audio');
    mode = mode || pick(modes,1)[0]; if(mode==='reading' && !kanjiWord) mode='jp2zh';
    const sent = item.jp.length>9 || /\s/.test(item.jp);
    const bigJp = `<div class="big ${sent?'sent':''} jp" style="${sent?'text-align:center':''}">${esc(item.jp)}</div>`;
    const rdLine = kanjiWord ? `<div class="rd">${esc(item.rd)}</div>` : '';
    const roLine = kanaOnly(item.rd) ? roHtml(item.rd) : '';
    if (mode==='zh2jp'){ Object.assign(q, {ask:'日文怎麼說？', big:`<div class="zhbig">${esc(item.zh)}</div>`, ...mkOpts(item.jp, distract(item,x=>x.jp), true)}); }
    else if (mode==='reading'){ Object.assign(q, {ask:'這個詞怎麼唸？', big:bigJp+`<div class="ro">${esc(item.zh)}</div>`, ...mkOpts(item.rd, distract(item,x=>x.rd,3,x=>hasKanji(x.jp)), true)}); }
    else if (mode==='audio'){ Object.assign(q, {ask:'聽發音，選出正確的意思', big:speakBtn(item.rd,'huge'), autoplay:item.rd, ...mkOpts(item.zh, distract(item,x=>x.zh), false)}); }
    else { Object.assign(q, {ask:'這是什麼意思？', big:bigJp+rdLine+roLine, ...mkOpts(item.zh, distract(item,x=>x.zh), false)}); }
    q.speak=item.rd;
    q.explain = `<span class="jp">${esc(item.jp)}</span>${kanjiWord?`（<span class="jp">${esc(item.rd)}</span>）`:''} ＝ ${esc(item.zh)}`;
  }
  else if (item.type==='kanji'){
    mode = mode || pick(['k2zh','ex2rd','ex2rd','exzh'],1)[0];
    if (mode==='ex2rd'){ Object.assign(q, {ask:'這個詞怎麼唸？', big:`<div class="big jp">${esc(item.ex)}</div><div class="ro">${esc(item.exz)}</div>`, ...mkOpts(item.exr, distract(item,x=>x.exr), true), speak:item.exr}); }
    else if (mode==='exzh'){ Object.assign(q, {ask:'這個詞是什麼意思？', big:`<div class="big jp">${esc(item.ex)}</div><div class="rd">${esc(item.exr)}</div>`, ...mkOpts(item.exz, distract(item,x=>x.exz), false), speak:item.exr}); }
    else { Object.assign(q, {ask:'這個漢字的意思是？', big:`<div class="big kana-only jp" style="font-weight:500">${esc(item.jp)}</div>`, ...mkOpts(item.zh, distract(item,x=>x.zh), false), speak:item.exr}); }
    q.explain = `<span class="jp">${esc(item.jp)}</span>：${esc(item.zh)}　音 ${esc(item.on)}／訓 ${esc(item.kun)}<br>例：<span class="jp">${esc(item.ex)}（${esc(item.exr)}）</span>＝${esc(item.exz)}`;
  }
  else if (item.type==='grammar'){
    const s = esc(item.q).replace('＿＿','<u style="text-decoration-thickness:2px;text-underline-offset:5px">　　　</u>');
    Object.assign(q, {ask:'選出最適當的答案', big:`<div class="big sent jp">${s}</div>`, ...mkOpts(item.a, shuffle(item.d).slice(0,3), true), speak:item.ex});
    q.explain = `<b>${esc(item.t)}</b>：${esc(item.m)}<div class="ex"><span class="jp">${esc(item.ex)}</span><br>${esc(item.zh)}</div>`;
  }
  return q;
}
function readingQs(passage){
  return passage.qs.map(rq => { const o=mkOpts(rq.c[rq.a], rq.c.filter((_,i)=>i!==rq.a), true);

function back(){ S=null; C=null; VIEW=STACK.pop()||{name:'home'}; window.scrollTo(0,0); render(); }

function startLesson(id){
  const l=LESSON_BY_ID[id]; if(!l) return;
  if (l.type==='learn'){
    const quiz = shuffle(l.items).map(it => makeQ(it, it.type==='grammar'?'lesson':it.type==='vocab'?pick(['jp2zh','jp2zh','zh2jp'],1)[0]:it.type==='kanji'?'k2zh':'k2ro'));
    beginSession({kind:'lesson', lesson:l, title:l.title, learn:l.items, queue:quiz});
  } else if (l.type==='reading'){
    beginSession({kind:'reading', lesson:l, title:l.title, queue:l.passages.flatMap(readingQs)});
  } else if (l.type==='convo'){ startConvo(l.convo, l); }
  else if (l.type==='test'){
    const W=D.weeks[l.w]; const items=[...W.kana,...W.vocab,...W.kanji,...W.grammar];
    let qs = pick(items, 18).map(it=>makeQ(it));
    const L = LISTEN.filter(x=>x.w===l.w); if(L.length) qs.push(...pick(L,2).map(listenQ));
    beginSession({kind:'test', lesson:l, title:l.title, queue:shuffle(qs)});
  }
  else if (l.type==='mock') startMock(l);
  else if (l.type==='weak' || l.type==='final') startPractice(l.type, l);
}
function startPractice(kind, l){
  let ids = learnedIds();
  if (kind==='weak'){ const weak=ids.filter(id=>state.srs[id][2]>0||state.srs[id][0]<=2).sort((a,b)=>state.srs[b][2]-state.srs[a][2]); ids = weak.length>=10?weak.slice(0,30):pick(ids,30); }
  else ids = pick(ids, 40);
  if (!ids.length){ toast('還沒有學過的內容，先去上第一課吧！'); return; }
  beginSession({kind:'practice', lesson:l, title:l?.title||'練習', queue:shuffle(ids).map(id=>makeQ(D.items[id]))});
}
function startReview(){
  const ids=dueIds().slice(0, state.settings.reviewMax);

function startMock(l){
  const n4=l.level==='N4';
  const lvW = it => n4 ? true : it.w<=11;
  const vPool = POOL.vocab.filter(x=>x.w>=4 && (n4? (x.w>=12 || Math.random()<.3) : x.w<=11) && hasKanji(x.jp));
  const vocabQ = pick(vPool, n4?25:20).map((it,i)=>{ const q=makeQ(it, i%3===0?'zh2jp':i%3===1?'reading':'jp2zh'); q.section='文字・語彙'; return q; });
  const gPool = POOL.grammar.filter(x=> n4 ? (x.w>=12 || Math.random()<.25) : x.w<=11);
  const gramQ = pick(gPool, n4?20:15).map(it=>{ const q=makeQ(it); q.section='文法'; return q; });
  const rd = pick(READING.filter(r=>r.lv===l.level), n4?3:2).flatMap(readingQs);
  const lsPool = LISTEN.filter(x=> n4 ? x.w>=4 : x.w<=11);
  const lisQ = pick(lsPool, n4?12:10).map(listenQ);
  beginSession({kind:'mock', lesson:l, title:l.title, level:l.level, queue:[...vocabQ,...gramQ,...rd,...lisQ], timeLimit:(n4?70:50)*60, startedAt:Date.now()});
}
function beginSession(cfg){
  STACK.push(VIEW); VIEW={name:'session'}; C=null;
  S={...cfg, phase: cfg.learn?.length?'learn':'quiz', li:0, qi:0, picked:null, correct:0, answered:0, wrong:[], requeued:new Set(), firstWrong:new Set(), answers:[], xp:0};
  window.scrollTo(0,0); render();
}
function answer(i){
  if (!S || S.picked!==null) return;
  const q=S.queue[S.qi]; S.picked=i;
  const ok = q.okIdx ? q.okIdx.includes(i) : i===q.ans;
  const isRe = S.requeued.has(S.qi);
  if (S.kind==='mock'){ S.answers.push({q,ok,i}); if(ok) S.correct++; S.answered++; next(); return; }
  if (!isRe){ S.answered++; if(ok){ S.correct++; S.xp+=2; } else { S.wrong.push(q); } }
  if (q.item){
    if (S.kind==='review' || S.kind==='practice'){ if(!isRe) srsAnswer(q.item.id, ok); else if(ok) srsSet(q.item.id, 1, today()+1); }
    if (!ok) S.firstWrong.add(q.item.id);
    if (!ok && !isRe && S.kind!=='test'){ const nq=makeQ(q.item, q.item.type==='grammar'?'lesson':undefined); S.queue.push(nq); S.requeued.add(S.queue.length-1); }
  }
  if (ok && !isRe) award(2,{q:1}); else if(!isRe) award(0,{q:1});
  if (q.speak && ok && (q.item?.type!=='grammar')) speak(q.speak);
  render();
}
function next(){
  if (!S) return;
  S.picked=null;
  if (S.qi < S.queue.length-1){ S.qi++; render(); maybeAutoplay(); return; }
  finishSession();
}
function maybeAutoplay(){ const q=S?.queue[S.qi]; if(q && q.autoplay && S.phase==='quiz') setTimeout(()=>speak(q.autoplay), 250); }
function finishSession(){
  const s=S; s.phase='result';
  const acc = s.answered ? s.correct/s.answered : 0;
  const L=s.lesson; let msg='';
  if (s.kind==='lesson'){
    const first=!lessonDone(L.id);
    s.items = L.items;
    L.items.forEach(it=>{ if(!state.srs[it.id]) srsSet(it.id, s.firstWrong.has(it.id)?0:1, s.firstWrong.has(it.id)?today():today()+1); else if(s.firstWrong.has(it.id)) state.srs[it.id][1]=today(); });
    state.lessons[L.id]={done:true, best:Math.max(acc, state.lessons[L.id]?.best||0)};
    award(first?15:5,{l:1}); s.xp+=first?15:5;
  }
  else if (s.kind==='reading'){ state.lessons[L.id]={done:true, best:Math.max(acc, state.lessons[L.id]?.best||0)}; award(10,{l:1}); s.xp+=10; }
  else if (s.kind==='test'){
    state.lessons[L.id]={done: acc>=PASS || lessonDone(L.id), best:Math.max(acc, state.lessons[L.id]?.best||0)};
    s.wrong.forEach(q=>{ if(q.item && state.srs[q.item.id]) state.srs[q.item.id][1]=today(); });
    if (acc>=PASS){
      const wasPassed=isPassed(L.w);
      state.weeks[L.w]={passed:true, score:Math.max(acc, state.weeks[L.w]?.score||0), date: state.weeks[L.w]?.date||today()};
      if (!wasPassed){ award(100,{l:1}); s.xp+=100; s.stamp=true; }
    }
  }
  else if (s.kind==='mock'){
    const secA = s.answers.filter(a=>a.q.section!=='聽解'), secB=s.answers.filter(a=>a.q.section==='聽解');
    const A=Math.round(120*secA.filter(a=>a.ok).length/Math.max(1,secA.length)), B=Math.round(60*secB.filter(a=>a.ok).length/Math.max(1,secB.length));
    const need = s.level==='N4'?90:80;
    s.score={A,B,total:A+B,pass:(A+B)>=need && A>=38 && B>=19, need, secs:['文字・語彙','文法','讀解','聽解'].map(n=>{const a=s.answers.filter(x=>x.q.section===n);return [n,a.filter(x=>x.ok).length,a.length];})};
    s.wrong = s.answers.filter(a=>!a.ok).map(a=>a.q);
    state.exams.push({level:s.level, id:L.id, day:today(), A, B, total:A+B, pass:s.score.pass});
    state.lessons[L.id]={done:true, best:Math.max(A+B, state.lessons[L.id]?.best||0)};
    award(50,{l:1}); s.xp+=50;
    // 第 25、26 站的過站條件
    const w25 = lessonDone('25-m5') && lessonDone('25-m4a');
    if (w25 && !isPassed(25)){ state.weeks[25]={passed:true, score:1, date:today()}; s.stamp=true; }
    if (s.level==='N4' && s.score.pass && isPassed(25) && !isPassed(26)){ state.weeks[26]={passed:true, score:(A+B)/180, date:today()}; s.stamp=true; }
  }
  else if (s.kind==='practice' && L){ state.lessons[L.id]={done:true, best:Math.max(acc, state.lessons[L.id]?.best||0)}; award(10,{l:1}); s.xp+=10; }
  save(); render();
  if (s.stamp) setTimeout(()=>speak(STATIONS[L.w][1]), 300);
}

function startConvo(sc, l){
  STACK.push(VIEW); VIEW={name:'convo'}; S=null;
  C={sc, l, i:0, shown:[], pending:null, picked:null, first:0, total:0, done:false, zh:state.settings.zh, choiceOrder:null};
  advanceConvo(); window.scrollTo(0,0);
}
function advanceConvo(){
  if (!C) return;
  C.pending=null; C.picked=null;
  while (C.i < C.sc.lines.length){
    const ln=C.sc.lines[C.i];
    if (Array.isArray(ln)){
      C.shown.push({who:ln[0], jp:ln[1], zh:ln[2], me:ln[0]==='你'}); C.i++;
      if (ln[0]!=='你' && state.settings.autoplay) speak(ln[1], true);
      if (ln[0]!=='你'){ const nxt=C.sc.lines[C.i]; if(nxt && Array.isArray(nxt) && nxt[0]!=='你'){ break; } }
      continue;
    }
    C.pending=ln; C.choiceOrder=shuffle(ln.c.map((_,k)=>k)); C.total++; break;
  }
  if (!C.pending && C.i>=C.sc.lines.length) finishConvo();
  render(); setTimeout(()=>{ const el=document.querySelector('.chat-end'); el && el.scrollIntoView({block:'end', behavior:'smooth'}); }, 30);
}
function convoPick(k){
  if (!C || !C.pending || C.picked!==null) return;
  const ln=C.pending, ok=(ln.ok||[0]).includes(k);
  C.picked=k; if(ok) C.first++;
  award(ok?3:0,{q:1});
  render();
}
function convoContinue(){
  if (!C) return;
  const ln=C.pending;
  if (ln && C.picked!==null){
    const ok=(ln.ok||[0]).includes(C.picked); const k= ok ? C.picked : (ln.ok||[0])[0];
    if (!ln.q){ C.shown.push({who:'你', jp:ln.c[k][0], zh:ln.c[k][1], me:true}); speak(ln.c[k][0]); }
    C.i++;
  } else if (!ln && C.i<C.sc.lines.length) {}
  advanceConvo();
}
function finishConvo(){
  if (C.done) return; C.done=true;
  const id=C.sc.id; const acc=C.total?C.first/C.total:1;
  state.convo[id]=Math.max(acc, state.convo[id]||0);
  if (C.l) state.lessons[C.l.id]={done:true, best:Math.max(acc, state.lessons[C.l.id]?.best||0)};
  award(20,{l:1}); save();
}

function dictList(){

    if (x.type==='kana') return `<div class="dict-item"><div><span class="a">${esc(x.jp)}</span>　<span class="b">${esc(x.ro)}</span></div><div class="row" style="gap:6px">${st(x.id)}<button class="iconbtn" data-speak="${esc(x.jp)}" aria-label="發音">${ICON.speak}</button></div></div>`;
    return `<div class="dict-item"><div style="min-width:0"><div class="a">${esc(x.jp)}${hasKanji(x.jp)?` <span class="b jp" style="font-weight:400">${esc(x.rd)}</span>`:''}</div><div class="b">${esc(x.zh)}　<span class="lvl">第${x.w}週</span></div></div><div class="row" style="gap:6px">${st(x.id)}<button class="iconbtn" data-speak="${esc(x.rd)}" aria-label="發音">${ICON.speak}</button></div></div>`;
  }).join('') + (arr.length>200?`<p class="small muted">還有 ${arr.length-200} 筆，請輸入關鍵字縮小範圍。</p>`:'') + (!arr.length?'<p class="muted">找不到符合的項目。</p>':'');

function learnCard(it){
  const sp = it.type==='kana'?it.jp : it.type==='vocab'?it.rd : it.type==='kanji'?it.exr : it.ex;
  if (it.type==='kana') return `<div class="learn"><div class="head"><div class="glyph kana jp">${esc(it.jp)}</div><div class="meaning">${esc(it.ro)}</div>${speakBtn(it.jp)}</div></div>`;
  if (it.type==='vocab'){ const kj=hasKanji(it.jp);
    return `<div class="learn"><div class="head"><div class="glyph jp" style="${it.jp.length>8?'font-size:clamp(24px,7vw,34px)':''}">${esc(it.jp)}</div>${kj?`<div class="rd">${esc(it.rd)}</div>`:''}${kanaOnly(it.rd)?(showRomaji()?`<div class="ro muted">${esc(toRomaji(it.rd))}</div>`:roHtml(it.rd)):''}<div class="meaning">${esc(it.zh)}</div>${speakBtn(sp)}</div></div>`; }
  if (it.type==='kanji') return `<div class="learn"><div class="head"><div class="glyph kanji jp">${esc(it.jp)}</div><div class="meaning">${esc(it.zh)}</div></div>
    <dl class="kv"><dt>音讀</dt><dd>${esc(it.on)}</dd><dt>訓讀</dt><dd>${esc(it.kun)}</dd></dl>
    <div class="example"><div style="flex:1"><div class="s">${esc(it.ex)}　<span class="muted" style="font-size:14px">${esc(it.exr)}</span></div><div class="z">${esc(it.exz)}</div></div>${speakBtn(sp)}</div></div>`;
  return `<div class="learn"><div class="head"><div class="glyph jp" style="font-size:clamp(22px,6.5vw,30px)">${esc(it.t)}</div><div style="font-size:16px">${esc(it.m)}</div></div>
    <dl class="kv"><dt>接續</dt><dd>${esc(it.s)}</dd></dl>
    <div class="example"><div style="flex:1"><div class="s">${esc(it.ex)}</div><div class="z">${esc(it.zh)}</div></div>${speakBtn(sp)}</div></div>`;
}
function viewSession(){
  const s=S;
  if (s.phase==='learn'){
    const it=s.learn[s.li];
    const note = s.li===0 && s.lesson?.note ? `<div class="note" style="--lc:${lc(s.lesson.w)}">${esc(s.lesson.note)}</div>` : '';
    return `${sessionTop(s.li+1, s.learn.length, '學習')}<main class="qwrap" style="--lc:${s.lesson?lc(s.lesson.w):'var(--ink)'}">${note}${learnCard(it)}
     <div class="row"><button class="btn" data-act="lprev" ${s.li?'':'disabled'} style="flex:1">上一張</button><button class="btn line" data-act="lnext" style="flex:2">${s.li<s.learn.length-1?'下一張':'開始小測驗'}</button></div>
     <button class="btn ghost small" data-act="lskip">跳過，直接測驗</button></main>`;
  }
  if (s.phase==='result') return viewResult();
  const q=s.queue[s.qi];
  const mock=s.kind==='mock';
  const pas = q.passage ? `<div class="card" style="text-align:left"><div class="small muted" style="margin-bottom:6px">${esc(q.passage.title)}</div><div class="jp" style="white-space:pre-line;font-size:16.5px;line-height:1.85">${esc(q.passage.text)}</div></div>` : '';
  const picked=s.picked!==null;
  const okSet = q.okIdx || [q.ans];
  const opts=q.opts.map((o,i)=>{
    let cls='opt'+(o.jp?' jp':''); if(picked){ if(okSet.includes(i)) cls+=' right'; else if(i===s.picked) cls+=' wrong'; }
    const ro = o.jp && showRomaji() && kanaOnly(o.t) && o.t.length<=14 ? `<small>${esc(toRomaji(o.t))}</small>` : '';
    return `<button class="${cls}" data-opt="${i}" ${picked?'disabled':''}><span class="k">${i+1}</span><span class="tx">${esc(o.t)}${ro}</span></button>`;
  }).join('');
  const longOpts = q.opts.some(o=>o.t.length>10);
  const ok = picked && okSet.includes(s.picked);
  const fb = picked ? `<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'答對了！':'答錯了'}</b>　${q.explain||''}</div>
      <div class="row">${q.speak&&!q.listen?`<button class="btn" data-speak="${esc(q.speak)}">${ICON.speak}再聽一次</button>`:''}<button class="btn primary" style="flex:1" data-act="next">${s.qi<s.queue.length-1?'下一題':'看結果'}</button></div>` : '';
  const sec = q.section ? `<span class="tag" style="--lc:var(--exam)">${esc(q.section)}</span>` : '';
  return `${sessionTop(s.qi+1, s.queue.length, mock?timerHTML():'')}<main class="qwrap">
    ${pas}<div class="prompt">${sec?`<div>${sec}</div>`:''}<div class="ask">${q.ask}</div>${q.big}</div>
    <div class="opts ${longOpts?'one':''}">${opts}</div>${fb}</main>`;
}
function timerHTML(){ if(!S?.timeLimit) return ''; const left=S.timeLimit-Math.floor((Date.now()-S.startedAt)/1000); const m=Math.floor(Math.abs(left)/60), sec=Math.abs(left)%60; return `<span class="timer num" id="timer" style="color:${left<0?'var(--bad)':'inherit'}">${left<0?'-':''}${m}:${String(sec).padStart(2,'0')}</span>`; }
function sessionTop(i, n, right){

  const wr = s.wrong.slice(0,30).map(q=>`<div class="feedback bad" style="color:var(--ink)">${q.passage?`<div class="small muted">${esc(q.passage.title)}</div>`:''}${q.explain||''}</div>`).join('');
  const nxt = L ? nextLessons(L.w,1)[0] : null;
  return `<header class="topbar"><div class="grow"><b>結果</b></div></header><main class="stack">${head}${stamp}
   ${wr?`<div class="section-title">要再看一次的題目</div>${wr}`:''}
   <div class="row">${L&&s.kind!=='mock'?`<button class="btn" style="flex:1" data-act="again">再來一次</button>`:''}${s.kind==='mock'?`<button class="btn" style="flex:1" data-lesson="${L.id}">再考一次</button>`:''}
   ${nxt?`<button class="btn line" style="flex:2;--lc:${lc(L.w)}" data-lesson="${nxt.id}">下一課：${esc(nxt.title)}</button>`:`<button class="btn primary" style="flex:2" data-act="done">回到首頁</button>`}</div>
   ${nxt?`<button class="btn ghost" data-act="done">回到首頁</button>`:''}</main>`;
}
function viewConvo(){
  const c=C, sc=c.sc;
  const bubbles=c.shown.map(b=>`<div class="bub ${b.me?'me':'npc'}"><div class="who">${esc(b.who)}</div><div class="jp">${esc(b.jp)}</div>${showRomaji()&&kanaOnly(b.jp)?`<div class="ro">${esc(toRomaji(b.jp))}</div>`:''}${c.zh?`<div class="zh">${esc(b.zh)}</div>`:''}${!b.me?`<button class="iconbtn say" data-speak="${esc(b.jp)}" aria-label="播放">${ICON.speak}</button>`:''}</div>`).join('');
  let panel='';
  if (c.pending){
    const ln=c.pending, okSet=ln.ok||[0], picked=c.picked!==null;
    const opts=c.choiceOrder.map((k,idx)=>{ let cls='opt'+(ln.q?'':' jp'); if(picked){ if(okSet.includes(k)) cls+=' right'; else if(k===c.picked) cls+=' wrong'; }
      const ro = !ln.q && showRomaji() && kanaOnly(ln.c[k][0]) ? `<small>${esc(toRomaji(ln.c[k][0]))}</small>` : '';
      return `<button class="${cls}" data-cpick="${k}" ${picked?'disabled':''}><span class="k">${idx+1}</span><span class="tx">${esc(ln.c[k][0])}${ro}${picked&&!ln.q&&ln.c[k][1]?`<small>${esc(ln.c[k][1])}</small>`:''}</span></button>`; }).join('');
    const ok=picked && okSet.includes(c.picked);
    panel=`<div class="card stack" style="gap:10px"><div class="small muted">${ln.q?'聽懂了嗎？':'輪到你說話了，選擇最適當的回應：'}</div>${ln.q?`<b>${esc(ln.q)}</b>`:''}<div class="opts one">${opts}</div>
      ${picked?`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'很好！':'再想想'}</b>　${esc(ln.fb||'')}</div><button class="btn line" data-act="cnext">繼續</button>`:''}</div>`;
  } else if (c.done){

      <div class="row" style="width:100%"><button class="btn" style="flex:1" data-act="creplay">再練一次</button><button class="btn primary" style="flex:1" data-act="done">回到首頁</button></div></div>`;
  } else {
    panel=`<button class="btn line block" data-act="cnext">繼續</button>`;

   <div class="chat">${bubbles}<span class="chat-end"></span></div>${panel}</main>`;
}

// ================= 事件 =================
document.addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset;
  if (d.speak!==undefined && !d.opt){ speak(d.speak); return; }
  if (d.reveal){ t.outerHTML=`<div class="ro">${esc(d.reveal)}</div>`; return; }
  if (d.tab){ tab(d.tab); return; }
  if (d.go){ go(d.go); return; }
  if (d.week){ const w=+d.week; if(isUnlocked(w)) go('week',{w}); else toast(`先通過第 ${w-1} 週的週測驗才能前往`); return; }
  if (d.lesson){ const l=LESSON_BY_ID[d.lesson]; if(l && !isUnlocked(l.w)){ toast('這一站還沒解鎖'); return; } if(S||C){ S=null; C=null; VIEW=STACK.pop()||{name:'home'}; } startLesson(d.lesson); maybeAutoplay(); return; }
  if (d.convo){ const sc=CONVO.find(x=>x.id===d.convo); startConvo(sc, LESSON_BY_ID[`${sc.w}-c`]); return; }
  if (d.opt!==undefined){ answer(+d.opt); return; }
  if (d.cpick!==undefined){ convoPick(+d.cpick); return; }
  if (d.dtab){ dictTab=d.dtab; render(); return; }
  if (d.set){ let v=d.val; if(v==='true') v=true; else if(v==='false') v=false; else if(!isNaN(+v)) v=+v; state.settings[d.set]=v; save(); render(); return; }
  switch(d.act){
    case 'back': back(); break;
    case 'review': startReview(); maybeAutoplay(); break;
    case 'weak': startPractice('weak', null); break;
    case 'lnext': if(S.li<S.learn.length-1){ S.li++; render(); } else { S.phase='quiz'; render(); maybeAutoplay(); } window.scrollTo(0,0); break;
    case 'lprev': if(S.li>0){ S.li--; render(); } break;
    case 'lskip': S.phase='quiz'; render(); maybeAutoplay(); break;
    case 'next': next(); window.scrollTo(0,0); break;
    case 'quit': quitConfirm=true; render(); break;
    case 'quit-no': quitConfirm=false; render(); break;
    case 'quit-yes': quitConfirm=false; if(S && S.kind==='review') save(); back(); break;
    case 'again': { const l=S.lesson; S=null; VIEW=STACK.pop()||{name:'home'}; startLesson(l.id); maybeAutoplay(); break; }
    case 'done': S=null; C=null; tab('home'); break;
    case 'cnext': convoContinue(); break;
    case 'czh': C.zh=!C.zh; render(); break;
    case 'cquit': C=null; back(); break;
    case 'creplay': { const sc=C.sc, l=C.l; C=null; VIEW=STACK.pop()||{name:'home'}; startConvo(sc,l); break; }
    case 'reset': confirmReset=true; render(); break;
    case 'reset-no': confirmReset=false; render(); break;
    case 'reset-yes': confirmReset=false; state=freshState(); state.updated=Date.now(); saveLocal(); pushCloud(); toast('已清除所有學習紀錄'); tab('home'); break;
  }
});
document.addEventListener('change', e=>{ if(e.target.id==='startdate' && e.target.value){ const [y,m,dd]=e.target.value.split('-').map(Number); state.start=Math.floor(Date.UTC(y,m-1,dd)/864e5); save(); toast('已更新計畫開始日'); } });
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (S && S.phase==='quiz'){ const n=+e.key; if(n>=1 && n<=S.queue[S.qi].opts.length && S.picked===null){ answer(n-1); e.preventDefault(); } else if((e.key==='Enter'||e.key===' ') && S.picked!==null){ next(); e.preventDefault(); } }
  else if (S && S.phase==='learn' && (e.key==='ArrowRight'||e.key==='Enter')){ document.querySelector('[data-act="lnext"]')?.click(); e.preventDefault(); }
  else if (C){ const n=+e.key; if(C.pending && C.picked===null && n>=1 && n<=C.choiceOrder.length){ convoPick(C.choiceOrder[n-1]); e.preventDefault(); } else if((e.key==='Enter') ){ document.querySelector('[data-act="cnext"]')?.click(); e.preventDefault(); } }
});
setInterval(()=>{ const el=$('#timer'); if(el && S?.timeLimit) el.outerHTML=timerHTML(); }, 1000);
window.addEventListener('pagehide', ()=>{ if(cloud.ref && state.updated) pushCloud(); });

// 讓開發者在主控台檢查資料
window.__JUKAN__ = {D, LESSON_BY_ID, LISTEN, toRomaji, weekLessons, makeQ, state:()=>state};

render();
initCloud();
})();

</script>
